name: macOS + Windows local smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22.12.0, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify contracts and production build
        run: npm run release:check

      - run: npm test

      - run: npm run build
      - run: npm run doctor
      - run: npm run tools:plan
      - run: npm run tools:catalog
      - run: npm run agents:plan
      - run: npm run capcut:doctor

      - name: Exercise idempotent local launcher
        env:
          CI: "1"
        run: npm run setup -- --no-open

      - run: npm run status

      - name: Stop only the verified CutSteward process
        if: always()
        run: npm run stop
