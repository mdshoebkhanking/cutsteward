<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Abstract verified film poster</title>
  <desc id="desc">A dark editorial video frame with warm gold light, layered panels, and a central play mark.</desc>
  <defs>
    <radialGradient id="ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#2a2418"/>
      <stop offset="0.5" stop-color="#11100c"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="0.42" stop-color="#cdbA91"/>
      <stop offset="1" stop-color="#685c43"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0e8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#f4f0e8" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="url(#ambient)"/>
  <ellipse cx="836" cy="470" rx="620" ry="320" fill="#cDBA91" opacity="0.08" filter="url(#soft)"/>
  <circle cx="836" cy="470" r="360" fill="none" stroke="#cDBA91" stroke-opacity="0.09" stroke-width="2"/>
  <circle cx="836" cy="470" r="285" fill="none" stroke="#cDBA91" stroke-opacity="0.08" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="246" y="143" width="1180" height="655" rx="42" fill="#080808" stroke="#cDBA91" stroke-opacity="0.38" stroke-width="2"/>
    <rect x="274" y="171" width="1124" height="599" rx="30" fill="url(#glass)" stroke="#f4f0e8" stroke-opacity="0.12"/>
  </g>

  <g opacity="0.9">
    <rect x="322" y="225" width="302" height="398" rx="22" fill="#f4f0e8" fill-opacity="0.035" stroke="#f4f0e8" stroke-opacity="0.12"/>
    <rect x="650" y="225" width="700" height="190" rx="22" fill="#f4f0e8" fill-opacity="0.035" stroke="#f4f0e8" stroke-opacity="0.12"/>
    <rect x="650" y="439" width="337" height="184" rx="22" fill="#f4f0e8" fill-opacity="0.025" stroke="#f4f0e8" stroke-opacity="0.1"/>
    <rect x="1013" y="439" width="337" height="184" rx="22" fill="#f4f0e8" fill-opacity="0.025" stroke="#f4f0e8" stroke-opacity="0.1"/>
  </g>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M362 282h182" stroke-width="8" opacity="0.72"/>
    <path d="M362 315h116" stroke-width="5" opacity="0.32"/>
    <path d="M690 280h300" stroke-width="8" opacity="0.72"/>
    <path d="M690 315h520" stroke-width="5" opacity="0.26"/>
    <path d="M690 348h412" stroke-width="5" opacity="0.18"/>
    <path d="M690 500h190" stroke-width="7" opacity="0.54"/>
    <path d="M1053 500h190" stroke-width="7" opacity="0.54"/>
  </g>

  <g transform="translate(473 460)">
    <circle r="74" fill="#050505" fill-opacity="0.74" stroke="#cDBA91" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M-16-29 36 0-16 29Z" fill="url(#gold)"/>
  </g>

  <g transform="translate(322 690)">
    <rect width="1028" height="8" rx="4" fill="#f4f0e8" fill-opacity="0.11"/>
    <rect width="716" height="8" rx="4" fill="url(#gold)" opacity="0.82"/>
    <circle cx="716" cy="4" r="13" fill="#f4f0e8" stroke="#cDBA91" stroke-width="3"/>
  </g>

  <g transform="translate(1320 115)" fill="none" stroke="#cDBA91" stroke-opacity="0.45">
    <path d="M0 30h95M47-17v95"/>
    <circle cx="47" cy="30" r="22"/>
  </g>
</svg>
